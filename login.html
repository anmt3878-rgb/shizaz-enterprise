<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIZAZ Enterprise AI — Sign In</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:440px;
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:35px;
}

.logo span{
    color:#36b9ff;
}

.box{
    background:#0c1929;
    border:1px solid #20384f;
    border-radius:18px;
    padding:35px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    color:#8fa2b6;
    line-height:1.5;
    margin-bottom:30px;
}

label{
    display:block;
    color:#b9c8d8;
    font-size:14px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    background:#07111f;
    border:1px solid #29445d;
    border-radius:8px;
    color:white;
    outline:none;
}

input:focus{
    border-color:#168cff;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:8px;
    background:#168cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.demo{
    margin-top:20px;
    text-align:center;
}

.demo a{
    color:#55c5ff;
    text-decoration:none;
    font-size:14px;
}

.message{
    margin-top:18px;
    text-align:center;
    color:#54e6a3;
    font-size:14px;
    display:none;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back a{
    color:#8295aa;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
SHIZAZ <span>Enterprise AI</span>
</div>

<div class="box">

<h1>Sign In</h1>

<p class="subtitle">
Access your enterprise command center.
</p>

<form id="loginForm">

<label>Business Email</label>

<input
type="email"
id="email"
placeholder="you@company.com"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

<button type="submit">
Sign In
</button>

</form>

<div class="message" id="message">
Authentication successful. Opening dashboard...
</div>

<div class="demo">
<a href="#" id="demoLogin">
Use Demo Account
</a>
</div>

</div>

<div class="back">
<a href="index.html">← Back to SHIZAZ Enterprise AI</a>
</div>

</div>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){

    e.preventDefault();

    message.style.display = "block";

    setTimeout(function(){

        window.location.href = "dashboard.html";

    },1000);

});


document.getElementById("demoLogin").addEventListener("click",function(e){

    e.preventDefault();

    document.getElementById("email").value = "demo@enterprise.ai";
    document.getElementById("password").value = "demo123";

});

</script>

</body>
</html>
